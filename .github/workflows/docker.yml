name: Build Docker image

# Builds and publishes ghcr.io/<owner>/<repo> (this fork), not the upstream
# registries. No repository secrets are required: GHCR is authenticated with
# the workflow's own GITHUB_TOKEN.
#
# Release-only, like upstream: a version tag is what produces a publishable
# image. `workflow_dispatch` exists to build any branch on demand without
# tagging it.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  # Needed by provenance/SBOM attestations.
  id-token: write
  attestations: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also publish to Docker Hub. Add DOCKER_HUB_USERNAME and
      # DOCKER_HUB_TOKEN repository secrets, then uncomment this step and the
      # second image in the metadata step above.
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The Go stage runs under QEMU for non-amd64 targets, so every extra
          # platform roughly doubles the build time. Add arm/v7, arm/v6 or 386
          # here only if you actually deploy to them.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # Avoids the unauthenticated GitHub API rate limit when
          # DockerInit.sh resolves the latest mtg-multi release.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
